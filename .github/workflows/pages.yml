# Build the static site and publish it to GitHub Pages.
# Netlify deploys are unaffected (netlify.toml). Pages has no form backend of its own:
# Forms post to FormSubmit (emails iv.forthepeople@gmail.com once activated). Change FORMS_MODE below to "disabled" to turn them off.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build and test
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORMS_MODE: formsubmit
        run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
